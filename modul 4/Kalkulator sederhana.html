<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }
        .calculator {
            width: 220px;
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 15px;
            background-color: #fff;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        #display {
            width: calc(100% - 12px);
            margin-bottom: 15px;
            padding: 10px 5px;
            font-size: 20px;
            text-align: right;
            border: 1px solid #ddd;
            border-radius: 4px;
            background-color: #f9f9f9;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
        }
        .buttons button {
            height: 50px;
            font-size: 18px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            background-color: #e0e0e0;
            transition: background-color 0.2s;
        }
        .buttons button:hover {
            background-color: #d0d0d0;
        }
        .buttons button.operator {
            background-color: #f0a500;
            color: white;
        }
        .buttons button.operator:hover {
            background-color: #e09500;
        }
        .buttons button.clear {
            background-color: #f44336;
            color: white;
        }
        .buttons button.clear:hover {
            background-color: #d32f2f;
        }
        .buttons button.equals {
            background-color: #4CAF50;
            color: white;
            grid-column: span 2;
        }
        .buttons button.equals:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <input type="text" id="display" disabled>
        <div class="buttons">
            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button class="operator" onclick="appendValue('/')">÷</button>
            
            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button class="operator" onclick="appendValue('*')">×</button>
            
            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button class="operator" onclick="appendValue('-')">-</button>
            
            <button class="clear" onclick="clearDisplay()">C</button>
            <button onclick="appendValue('0')">0</button>
            <button class="equals" onclick="calculate()">=</button>
            <button class="operator" onclick="appendValue('+')">+</button>
        </div>
    </div>

    <script>
        const display = document.getElementById('display');
        
        function appendValue(value) {
            // Validasi input ganda operator
            const lastChar = display.value.slice(-1);
            const operators = ['+', '-', '*', '/'];
            
            if (operators.includes(lastChar) && operators.includes(value)) {
                // Ganti operator terakhir jika mencoba menambahkan operator baru
                display.value = display.value.slice(0, -1) + value;
                return;
            }
            
            display.value += value;
        }
        
        function clearDisplay() {
            display.value = '';
        }
        
        function calculate() {
            try {
                // Ganti simbol ÷ dan × untuk evaluasi yang benar
                const expression = display.value.replace(/÷/g, '/').replace(/×/g, '*');
                const result = eval(expression);
                
                // Tampilkan hasil dengan maksimal 10 digit
                display.value = parseFloat(result.toFixed(10)).toString();
            } catch (error) {
                display.value = 'Error';
                setTimeout(() => clearDisplay(), 1000);
            }
        }
        
        // Tambahan: Support keyboard input
        document.addEventListener('keydown', (e) => {
            if (/[0-9+\-*/.]/.test(e.key)) {
                appendValue(e.key);
            } else if (e.key === 'Enter') {
                calculate();
            } else if (e.key === 'Escape') {
                clearDisplay();
            }
        });
    </script>
</body>
</html>
