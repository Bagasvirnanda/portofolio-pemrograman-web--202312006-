<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri Gambar Slideshow</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background-color: #f5f5f5;
            color: #333;
        }
        
        h2 {
            color: #2c3e50;
            margin-bottom: 20px;
        }
        
        .slideshow-container {
            position: relative;
            width: 500px;
            margin-bottom: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-radius: 8px;
            overflow: hidden;
        }
        
        #slideshow-image {
            width: 100%;
            height: auto;
            display: block;
            transition: opacity 0.5s ease;
        }
        
        .controls {
            display: flex;
            gap: 10px;
        }
        
        button {
            padding: 10px 20px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }
        
        button:hover {
            background-color: #2980b9;
        }
        
        .indicator {
            margin-top: 15px;
            font-size: 14px;
            color: #7f8c8d;
        }
    </style>
</head>
<body>
    <h2>Galeri Gambar Slideshow</h2>
    
    <div class="slideshow-container">
        <img id="slideshow-image" src="" alt="Slideshow">
    </div>
    
    <div class="controls">
        <button onclick="gantiGambar(-1)">Previous</button>
        <button onclick="gantiGambar(1)">Next</button>
    </div>
    
    <div class="indicator">
        <span id="image-counter"></span>
    </div>

    <script>
        const gambar = [
            "https://sumeksradio.disway.id/upload/5300ef8b87bc67ba622dda92a928055e.jpg",
            "https://files.intervest.io/articles/2024-12/1734340213-pt-raharja-energi-cepu-tbk-ratu-siap-ipo-di-bursa-efek-indonesia.webp",
            "https://jalurdua.com/wp-content/uploads/2020/09/Pabrik-chandra-asri.jpeg",
            "https://placehold.co/500x300/f39c12/ffffff?text=Gambar+4",
            "https://placehold.co/500x300/9b59b6/ffffff?text=Gambar+5"
        ];
        
        let indexGambar = 0;
        const imageElement = document.getElementById("slideshow-image");
        const counterElement = document.getElementById("image-counter");
        
        function tampilkanGambar() {
            // Efek fade out dan fade in
            imageElement.style.opacity = 0;
            
            setTimeout(() => {
                imageElement.src = gambar[indexGambar];
                imageElement.alt = `Gambar ${indexGambar + 1}`;
                imageElement.style.opacity = 1;
                
                // Update counter
                counterElement.textContent = `Gambar ${indexGambar + 1} dari ${gambar.length}`;
            }, 200);
        }
        
        function gantiGambar(arah) {
            indexGambar += arah;
            
            // Handle circular navigation
            if (indexGambar >= gambar.length) {
                indexGambar = 0;
            } else if (indexGambar < 0) {
                indexGambar = gambar.length - 1;
            }
            
            tampilkanGambar();
        }
        
        // Tambahkan keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') {
                gantiGambar(-1);
            } else if (e.key === 'ArrowRight') {
                gantiGambar(1);
            }
        });
        
        // Tampilkan gambar pertama saat halaman dimuat
        window.addEventListener('load', () => {
            tampilkanGambar();
            
            // Auto slideshow setiap 3 detik
            setInterval(() => {
                gantiGambar(1);
            }, 3000);
        });
    </script>
</body>
</html>
